<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Radial Slice Generator</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header>
      <h1>Video Radial Slice Generator</h1>
    </header>

    <main class="layout">
      <!-- Settings Panel -->
      <section class="settings-panel" aria-label="設定">
        <div class="field">
          <label for="videoFileInput">動画ファイル</label>
          <input id="videoFileInput" type="file" accept="video/*" />
        </div>

        <div class="field">
          <label for="startSecondInput">開始秒</label>
          <input id="startSecondInput" type="number" min="0" step="0.1" value="0" />
        </div>

        <div class="field">
          <label for="frameCountInput">フレーム数</label>
          <input id="frameCountInput" type="number" min="3" step="1" value="24" />
        </div>

        <div class="field">
          <label for="frameIntervalInput">フレーム間隔（秒）</label>
          <input id="frameIntervalInput" type="number" min="0.001" step="0.001" value="0.033333" />
        </div>

        <div class="field">
          <label for="foldbackCountInput">折り返し回数</label>
          <input id="foldbackCountInput" type="number" min="0" step="1" value="0" />
        </div>

        <div class="field">
          <label for="directionDegInput">向き角度（度）</label>
          <input id="directionDegInput" type="number" step="1" value="-90" />
        </div>

        <div class="field">
          <label for="sliceLengthInput">スライス長さ（px）</label>
          <input id="sliceLengthInput" type="number" min="1" step="1" value="300" />
        </div>

        <div class="field">
          <label for="outputRadiusInput">出力半径（px）</label>
          <input id="outputRadiusInput" type="number" min="1" step="1" value="512" />
        </div>

        <p id="errorMessage" class="error-message" role="alert" aria-live="assertive"></p>

        <div class="buttons">
          <button id="generateButton" type="button">生成</button>
          <button id="downloadButton" type="button">PNG保存</button>
        </div>
      </section>

      <!-- Preview Area -->
      <section class="preview-area" aria-label="プレビュー">
        <div class="video-preview">
          <video id="sourceVideo" muted playsinline></video>
          <canvas id="overlayCanvas"></canvas>
        </div>

        <canvas id="outputCanvas"></canvas>
      </section>

      <!-- Rotation Controller Panel -->
      <section class="rotation-panel" aria-label="回転コントローラー">
        <h2>回転</h2>
        
        <div class="field">
          <label for="rotationEnableInput">有効</label>
          <input id="rotationEnableInput" type="checkbox" />
        </div>

        <div class="field">
          <label for="refreshRateFpsInput">リフレッシュレート（FPS）</label>
          <input id="refreshRateFpsInput" type="number" min="1" step="1" value="60" disabled />
        </div>

        <div class="field">
          <label for="rotationSpeedInput">速度（度/秒）</label>
          <input id="rotationSpeedInput" type="range" min="0" max="360" step="1" value="30" disabled />
          <span id="rotationSpeedValue">30 deg/sec</span>
        </div>

        <div class="rotation-status">
          <p>現在の角度: <span id="currentRotationDisplay">0°</span></p>
        </div>

        <div class="buttons">
          <button id="resetRotationButton" type="button" disabled>リセット</button>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
