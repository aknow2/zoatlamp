<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebGPU Symmetric Ink Cloud</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000000;
      color: #f3eadc;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-columns: 340px 1fr;
      background: #000000;
    }

    aside {
      height: 100vh;
      max-height: 100vh;
      min-height: 0;
      padding: 18px;
      background: rgba(20, 18, 16, 0.92);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 8px;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0 0 18px;
      font-size: 12px;
      line-height: 1.6;
      color: rgba(243, 234, 220, 0.72);
    }

    label {
      display: grid;
      gap: 7px;
      margin: 14px 0;
      font-size: 12px;
      color: rgba(243, 234, 220, 0.86);
    }

    input[type="range"] { width: 100%; }

    .checkRow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0 8px;
      font-size: 13px;
      color: rgba(243, 234, 220, 0.92);
    }

    .checkRow label {
      margin: 0;
      display: inline;
    }

    button {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #2b2621;
      color: #f3eadc;
      border-radius: 10px;
      padding: 11px 12px;
      cursor: pointer;
      margin-top: 12px;
    }

    button:hover { background: #373029; }

    main {
      position: relative;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .error {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 32px;
      text-align: center;
      color: #f3eadc;
      background: #000000;
      font-weight: 700;
      line-height: 1.7;
    }

    .value {
      float: right;
      opacity: 0.7;
      font-variant-numeric: tabular-nums;
    }

    .note {
      font-size: 11px;
      opacity: 0.7;
      line-height: 1.5;
      margin-top: 10px;
      padding-bottom: 24px;
    }
  </style>
</head>

<body>
  <aside>
    <h1>点対称・墨雲 WebGPU</h1>
    <p>
      中心から放射状に広がる墨雲を WebGPU で生成します。<br>
      模様自体は静止し、画像全体のみを回転させます。
    </p>

    <label>
      対称数
      <span class="value" id="symmetryValue"></span>
      <input id="symmetry" type="range" min="2" max="100" step="1" value="20">
    </label>

    <label>
      雲の濃さ
      <span class="value" id="cloudValue"></span>
      <input id="cloud" type="range" min="0" max="2" step="0.01" value="0.8">
    </label>

    <label>
      雲の渦
      <span class="value" id="swirlValue"></span>
      <input id="swirl" type="range" min="0" max="100" step="0.01" value="7">
    </label>

    <label>
      余白
      <span class="value" id="paperValue"></span>
      <input id="paper" type="range" min="0" max="1" step="0.01" value="0.26">
    </label>

    <label>
      中心Y位置
      <span class="value" id="centerYValue"></span>
      <input id="centerY" type="range" min="-0.5" max="0.5" step="0.01" value="0.0">
    </label>

    <label>
      位相ずれ
      <span class="value" id="staggerValue"></span>
      <input id="stagger" type="range" min="0" max="2" step="0.01" value="0.1">
    </label>

    <label>
      初期回転（度）
      <span class="value" id="rotationValue"></span>
      <input id="rotation" type="range" min="-180" max="180" step="1" value="0">
    </label>

    <div class="checkRow">
      <input id="autoRotate" type="checkbox" checked>
      <label for="autoRotate">自動回転</label>
    </div>

    <label>
      回転スピード（度/秒）
      <span class="value" id="rotationSpeedValue"></span>
      <input id="rotationSpeed" type="range" min="-720" max="720" step="1" value="24">
    </label>

    <label>
      リフレッシュレート（FPS）
      <span class="value" id="refreshRateValue"></span>
      <input id="refreshRate" type="range" min="1" max="60" step="1" value="25">
    </label>

    <button id="reroll">模様を再生成</button>
    <button id="resetSpin">回転をリセット</button>
    <button id="savePng">中心位置を1:1でPNG保存</button>

    <div class="note">
      中心Y位置はプラスにすると上へ、マイナスにすると下へ移動します。<br>
      位相ずれは、対称セクターごとの模様のズレ量です。<br>
      回転スピードは -720 ～ 720 deg/sec で設定できます。<br>
      マイナスにすると逆回転します。<br>
      PNG保存では、現在の中心位置を基準に正方形で切り抜いて保存します。
    </div>
  </aside>

  <main>
    <canvas id="canvas"></canvas>
    <div class="error" id="error">
      このブラウザでは WebGPU が使えません。<br>
      Chrome / Edge の最新版で開いてください。
    </div>
  </main>

  <script type="module">
    const canvas = document.getElementById('canvas');
    const error = document.getElementById('error');

    const controlIds = [
      'symmetry',
      'cloud',
      'swirl',
      'paper',
      'centerY',
      'stagger',
      'rotation',
      'rotationSpeed',
      'refreshRate',
    ];

    const controls = Object.fromEntries(
      controlIds.map((id) => [id, document.getElementById(id)])
    );

    const valueEls = Object.fromEntries(
      controlIds.map((id) => [id, document.getElementById(`${id}Value`)])
    );

    const autoRotateEl = document.getElementById('autoRotate');
    const rerollButton = document.getElementById('reroll');
    const resetSpinButton = document.getElementById('resetSpin');
    const savePngButton = document.getElementById('savePng');

    function readParams() {
      return {
        symmetry: Number(controls.symmetry.value),
        cloud: Number(controls.cloud.value),
        swirl: Number(controls.swirl.value),
        paper: Number(controls.paper.value),
        centerY: Number(controls.centerY.value),
        stagger: Number(controls.stagger.value),
        rotation: Number(controls.rotation.value),
        rotationSpeed: Number(controls.rotationSpeed.value),
        refreshRate: Number(controls.refreshRate.value),
        autoRotate: autoRotateEl.checked,
      };
    }

    function syncLabels() {
      const params = readParams();

      valueEls.symmetry.textContent = String(params.symmetry);
      valueEls.cloud.textContent = params.cloud.toFixed(2);
      valueEls.swirl.textContent = params.swirl.toFixed(2);
      valueEls.paper.textContent = params.paper.toFixed(2);
      valueEls.centerY.textContent = params.centerY.toFixed(2);
      valueEls.stagger.textContent = params.stagger.toFixed(2);
      valueEls.rotation.textContent = `${Math.round(params.rotation)}°`;
      valueEls.rotationSpeed.textContent = `${Math.round(params.rotationSpeed)}°/s`;
      valueEls.refreshRate.textContent = `${Math.round(params.refreshRate)} FPS`;
    }

    let seed = Math.floor(Math.random() * 1_000_000_000);
    let spinOffsetDeg = 0;
    let animationFrameId = null;
    let lastTickMs = 0;
    let lastRenderMs = 0;

    function runSelfTests() {
      console.assert(controls.symmetry.max === '60', '対称数の最大値は40であるべきです');
      console.assert(controls.centerY !== null, 'centerY スライダーが存在するべきです');
      console.assert(controls.stagger !== null, 'stagger スライダーが存在するべきです');
      console.assert(controls.rotation !== null, 'rotation スライダーが存在するべきです');
      console.assert(controls.rotationSpeed !== null, 'rotationSpeed スライダーが存在するべきです');
      console.assert(controls.refreshRate !== null, 'refreshRate スライダーが存在するべきです');
      console.assert(controls.rotationSpeed.min === '-720', 'rotationSpeed の最小値は -720 であるべきです');
      console.assert(controls.rotationSpeed.max === '720', 'rotationSpeed の最大値は 720 であるべきです');
      console.assert(savePngButton !== null, 'savePng ボタンが存在するべきです');
      console.assert(typeof readParams().centerY === 'number', 'centerY は number であるべきです');
      console.assert(typeof readParams().stagger === 'number', 'stagger は number であるべきです');
      console.assert(getSquareCropRect(800, 600, 0).size === 600, '横長画面では短辺で切り抜くべきです');
      console.assert(getSquareCropRect(800, 600, 0).sx === 100, 'centerY=0 の切り抜きXは中央寄せであるべきです');
      console.assert(getSquareCropRect(800, 600, 0).sy === 0, 'centerY=0 の切り抜きYは中央寄せであるべきです');
      console.assert(getSquareCropRect(800, 600, 0.5).sy === 0, '上側へ寄せた切り抜きは上端でクランプされるべきです');
      console.assert(getSquareCropRect(800, 600, -0.5).sy === 0, '十分に収まる場合は下側でも全体を維持するべきです');
      console.assert(Number.isFinite(seed), 'seed は有限数であるべきです');
      console.info('Self tests passed');
    }

    function getSquareCropRect(width, height, centerY) {
      const size = Math.min(width, height);
      const minResolution = Math.min(width, height);
      const centerX = width * 0.5;
      const centerPixelY = (height - centerY * minResolution) * 0.5;
      const maxSx = Math.max(0, width - size);
      const maxSy = Math.max(0, height - size);
      const sx = Math.round(Math.min(Math.max(centerX - size * 0.5, 0), maxSx));
      const sy = Math.round(Math.min(Math.max(centerPixelY - size * 0.5, 0), maxSy));

      return { sx, sy, size };
    }

    async function main() {
      if (!navigator.gpu) {
        error.style.display = 'grid';
        return;
      }

      const adapter = await navigator.gpu.requestAdapter();

      if (!adapter) {
        error.textContent = 'WebGPU アダプタを取得できませんでした。';
        error.style.display = 'grid';
        return;
      }

      const device = await adapter.requestDevice();
      const context = canvas.getContext('webgpu');
      const format = navigator.gpu.getPreferredCanvasFormat();

      context.configure({
        device,
        format,
        alphaMode: 'opaque',
      });

      const uniformBuffer = device.createBuffer({
        size: 64,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });

      const cloudShader = device.createShaderModule({
        code: /* wgsl */`
struct Uniforms {
  resolution: vec2f,
  symmetry: f32,
  cloud: f32,
  swirl: f32,
  paper: f32,
  centerY: f32,
  stagger: f32,
  rotation: f32,
  seed: f32,
  pad0: f32,
  pad1: f32,
};

@group(0) @binding(0) var<uniform> u: Uniforms;

fn hash(p: vec2f) -> f32 {
  let h = dot(p, vec2f(127.1, 311.7));
  return fract(sin(h) * 43758.5453123);
}

fn noise(p: vec2f) -> f32 {
  let i = floor(p);
  let f = fract(p);

  let a = hash(i);
  let b = hash(i + vec2f(1.0, 0.0));
  let c = hash(i + vec2f(0.0, 1.0));
  let d = hash(i + vec2f(1.0, 1.0));

  let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(a, b, w.x), mix(c, d, w.x), w.y);
}

fn fbm(p0: vec2f) -> f32 {
  var p = p0;
  var amplitude = 0.5;
  var value = 0.0;

  for (var i = 0; i < 6; i = i + 1) {
    value += amplitude * noise(p);
    p = mat2x2f(1.62, 1.11, -1.11, 1.62) * p;
    amplitude *= 0.52;
  }

  return value;
}

@vertex
fn vs(@builtin(vertex_index) vertexIndex: u32) -> @builtin(position) vec4f {
  let positions = array<vec2f, 3>(
    vec2f(-1.0, -3.0),
    vec2f( 3.0,  1.0),
    vec2f(-1.0,  1.0)
  );

  return vec4f(positions[vertexIndex], 0.0, 1.0);
}

@fragment
fn fs(@builtin(position) position: vec4f) -> @location(0) vec4f {
  let tau = 6.28318530718;
  let pi = 3.14159265359;
  let minResolution = min(u.resolution.x, u.resolution.y);

  var uv = (position.xy * 2.0 - u.resolution) / minResolution;
  uv.y = -uv.y;

  // 画面上の固定中心。
  // centerY がプラスなら、模様の中心は画面上側へ移動する。
  let center = vec2f(0.0, u.centerY);
  let localUv = uv - center;

  // 固定中心との差分だけを回転させる。
  // これにより、回転時に中心が下方向へ流れない。
  let c = cos(u.rotation);
  let s = sin(u.rotation);
  uv = mat2x2f(c, -s, s, c) * localUv;

  let radius = length(uv);
  let rawAngle = atan2(uv.y, uv.x);

  let symmetry = max(2.0, u.symmetry);
  let sectorAngle = tau / symmetry;

  // セクター番号を取得して、半分まで行ったら戻るインデックスにする。
  // 例: 8分割 -> 0,1,2,3,4,3,2,1
  let wrappedAngle = fract((rawAngle + pi) / tau) * tau;
  let sectorIndex = floor(wrappedAngle / sectorAngle);
  let mirroredIndex = min(sectorIndex, symmetry - sectorIndex);

  // 模様自体は時間変化させず、セクターごとに静的な位相差を与える。
  let phase = mirroredIndex * u.stagger;
  let phaseVec = vec2f(cos(phase), sin(phase));

  let foldedAngle = abs(
    fract((rawAngle + sectorAngle * 0.5) / sectorAngle) * sectorAngle - sectorAngle * 0.5
  );

  let folded = vec2f(cos(foldedAngle), sin(foldedAngle)) * radius;
  let seedOffset = vec2f(u.seed * 0.000001, u.seed * 0.0000007);

  let basePoint = folded * (2.1 + radius * 2.6);

  // 位相ずれはノイズ座標を少しずらして表現する。
  // 時間は使わないため、模様が下へ流れることはない。
  let phaseOffset1 = phaseVec * 0.20;
  let phaseOffset2 = vec2f(phaseVec.y, -phaseVec.x) * 0.14;

  let warp = fbm(basePoint * 1.05 + seedOffset + phaseOffset1) - 0.5;

  let cloudPoint = basePoint
    + vec2f(u.swirl * warp, -u.swirl * 0.18 * radius)
    + phaseOffset2 * 0.35;

  var ink = fbm(cloudPoint * 2.2 + seedOffset + phaseOffset1);
  ink += 0.58 * fbm(cloudPoint * 5.1 - seedOffset + phaseOffset2);

  let radialRays = pow(abs(sin(foldedAngle * 5.5 + radius * 12.0 + warp * 2.0)), 5.0);
  ink += radialRays * 0.24 * smoothstep(0.12, 0.95, radius);

  let radialMask = 1.0 - smoothstep(0.82, 1.08, radius);
  ink *= radialMask;

  let inkMask = smoothstep(0.40 + u.paper * 0.25, 1.08, ink * u.cloud);

  let paperColor = vec3f(0.0, 0.0, 0.0);
  let inkColor = vec3f(1.0, 1.0, 1.0);

  let edgeFade = 1.0 - smoothstep(0.95, 1.18, radius);
  let mixAmount = clamp(inkMask * edgeFade, 0.0, 0.95);
  let color = mix(paperColor, inkColor, mixAmount);

  return vec4f(color, 1.0);
}
`,
      });

      const bindGroupLayout = device.createBindGroupLayout({
        entries: [
          {
            binding: 0,
            visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT,
            buffer: { type: 'uniform' },
          },
        ],
      });

      const bindGroup = device.createBindGroup({
        layout: bindGroupLayout,
        entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
      });

      const pipelineLayout = device.createPipelineLayout({
        bindGroupLayouts: [bindGroupLayout],
      });

      const cloudPipeline = device.createRenderPipeline({
        layout: pipelineLayout,
        vertex: { module: cloudShader, entryPoint: 'vs' },
        fragment: { module: cloudShader, entryPoint: 'fs', targets: [{ format }] },
        primitive: { topology: 'triangle-list' },
      });

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
        const height = Math.max(1, Math.floor(canvas.clientHeight * dpr));

        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
      }

      function getCurrentRotationDeg() {
        const params = readParams();
        return params.rotation + spinOffsetDeg;
      }

      function updateUniforms() {
        const params = readParams();
        const rotationRad = getCurrentRotationDeg() * Math.PI / 180;

        const data = new Float32Array([
          canvas.width,
          canvas.height,
          params.symmetry,
          params.cloud,
          params.swirl,
          params.paper,
          params.centerY,
          params.stagger,
          rotationRad,
          seed,
          0,
          0,
        ]);

        device.queue.writeBuffer(uniformBuffer, 0, data);
      }

      function render() {
        resize();
        updateUniforms();

        const view = context.getCurrentTexture().createView();
        const encoder = device.createCommandEncoder();

        const pass = encoder.beginRenderPass({
          colorAttachments: [
            {
              view,
              clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 1.0 },
              loadOp: 'clear',
              storeOp: 'store',
            },
          ],
        });

        pass.setBindGroup(0, bindGroup);
        pass.setPipeline(cloudPipeline);
        pass.draw(3);
        pass.end();

        device.queue.submit([encoder.finish()]);
      }

      async function saveSquarePng() {
        render();
        await device.queue.onSubmittedWorkDone();

        const params = readParams();
        const { sx, sy, size } = getSquareCropRect(canvas.width, canvas.height, params.centerY);
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = size;
        exportCanvas.height = size;

        const exportContext = exportCanvas.getContext('2d');

        if (!exportContext) {
          throw new Error('PNG保存用の2Dコンテキストを取得できませんでした。');
        }

        exportContext.drawImage(
          canvas,
          sx,
          sy,
          size,
          size,
          0,
          0,
          size,
          size,
        );

        const blob = await new Promise((resolve, reject) => {
          exportCanvas.toBlob((pngBlob) => {
            if (pngBlob) {
              resolve(pngBlob);
              return;
            }

            reject(new Error('PNGの生成に失敗しました。'));
          }, 'image/png');
        });

        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
        link.href = url;
        link.download = `ink-cloud-square-${timestamp}.png`;
        link.click();
        URL.revokeObjectURL(url);
      }

      function animationLoop(nowMs) {
        if (lastTickMs === 0) lastTickMs = nowMs;
        if (lastRenderMs === 0) lastRenderMs = nowMs;

        const params = readParams();
        const deltaMs = nowMs - lastTickMs;
        lastTickMs = nowMs;

        if (params.autoRotate) {
          spinOffsetDeg += params.rotationSpeed * (deltaMs / 1000);
        }

        const frameIntervalMs = 1000 / Math.max(1, params.refreshRate);

        if (nowMs - lastRenderMs >= frameIntervalMs) {
          render();
          lastRenderMs = nowMs;
        }

        animationFrameId = requestAnimationFrame(animationLoop);
      }

      for (const input of Object.values(controls)) {
        input.addEventListener('input', () => {
          syncLabels();
          render();
        });
      }

      autoRotateEl.addEventListener('change', () => {
        syncLabels();
        render();
      });

      rerollButton.addEventListener('click', () => {
        seed = Math.floor(Math.random() * 1_000_000_000);
        render();
      });

      resetSpinButton.addEventListener('click', () => {
        spinOffsetDeg = 0;
        render();
      });

      savePngButton.addEventListener('click', async () => {
        try {
          await saveSquarePng();
        } catch (err) {
          console.error(err);
          error.textContent = `PNG保存でエラーが発生しました: ${err.message}`;
          error.style.display = 'grid';
        }
      });

      window.addEventListener('resize', render);

      runSelfTests();
      resize();
      syncLabels();
      render();

      animationFrameId = requestAnimationFrame(animationLoop);

      window.addEventListener('beforeunload', () => {
        if (animationFrameId !== null) cancelAnimationFrame(animationFrameId);
      });
    }

    main().catch((err) => {
      console.error(err);
      error.textContent = `WebGPU初期化でエラーが発生しました: ${err.message}`;
      error.style.display = 'grid';
    });
  </script>
</body>
</html>
