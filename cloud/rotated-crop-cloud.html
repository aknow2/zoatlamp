<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebGPU Rotated Crop Cloud</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000000;
      color: #f3eadc;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-columns: 340px 1fr;
      background: #000000;
    }

    aside {
      height: 100vh;
      max-height: 100vh;
      min-height: 0;
      padding: 18px;
      background: rgba(20, 18, 16, 0.92);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 8px;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0 0 18px;
      font-size: 12px;
      line-height: 1.6;
      color: rgba(243, 234, 220, 0.72);
    }

    label {
      display: grid;
      gap: 7px;
      margin: 14px 0;
      font-size: 12px;
      color: rgba(243, 234, 220, 0.86);
    }

    input[type="range"] { width: 100%; }

    .checkRow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0 8px;
      font-size: 13px;
      color: rgba(243, 234, 220, 0.92);
    }

    .checkRow label {
      margin: 0;
      display: inline;
    }

    button {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #2b2621;
      color: #f3eadc;
      border-radius: 10px;
      padding: 11px 12px;
      cursor: pointer;
      margin-top: 12px;
    }

    button:hover { background: #373029; }

    main {
      position: relative;
      min-width: 0;
      min-height: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #000000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .error {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 32px;
      text-align: center;
      color: #f3eadc;
      background: #000000;
      font-weight: 700;
      line-height: 1.7;
    }

    .value {
      float: right;
      opacity: 0.7;
      font-variant-numeric: tabular-nums;
    }

    .note {
      font-size: 11px;
      opacity: 0.7;
      line-height: 1.5;
      margin-top: 10px;
      padding-bottom: 24px;
    }
  </style>
</head>

<body>
  <aside>
    <h1>回転切り抜き・墨雲 WebGPU</h1>
    <p>
      非対称の雲を固定位置で切り抜きます。<br>
      雲だけを配置数ぶん回転して、切り抜いた断片を円形に並べます。
    </p>

    <label>
      配置数
      <span class="value" id="symmetryValue"></span>
      <input id="symmetry" type="range" min="1" max="100" step="1" value="20">
    </label>

    <label>
      雲の濃さ
      <span class="value" id="cloudValue"></span>
      <input id="cloud" type="range" min="0" max="2" step="0.01" value="0.8">
    </label>

    <label>
      雲の渦
      <span class="value" id="swirlValue"></span>
      <input id="swirl" type="range" min="0" max="100" step="0.01" value="7">
    </label>

    <label>
      余白
      <span class="value" id="paperValue"></span>
      <input id="paper" type="range" min="0" max="1" step="0.01" value="0.26">
    </label>

    <label>
      中心Y位置
      <span class="value" id="centerYValue"></span>
      <input id="centerY" type="range" min="-0.5" max="0.5" step="0.01" value="0.0">
    </label>

    <label>
      切り取り幅
      <span class="value" id="cropFillValue"></span>
      <input id="cropFill" type="range" min="0.1" max="1" step="0.01" value="1">
    </label>

    <label>
      境界ぼかし
      <span class="value" id="cropFeatherValue"></span>
      <input id="cropFeather" type="range" min="0" max="0.25" step="0.01" value="0.02">
    </label>

    <label>
      元雲の初期回転（度）
      <span class="value" id="rotationValue"></span>
      <input id="rotation" type="range" min="-180" max="180" step="1" value="0">
    </label>

    <div class="checkRow">
      <input id="autoRotate" type="checkbox" checked>
      <label for="autoRotate">元雲を自動回転</label>
    </div>

    <label>
      元雲の回転スピード（度/秒）
      <span class="value" id="rotationSpeedValue"></span>
      <input id="rotationSpeed" type="range" min="-720" max="720" step="1" value="24">
    </label>

    <label>
      リフレッシュレート（FPS）
      <span class="value" id="refreshRateValue"></span>
      <input id="refreshRate" type="range" min="1" max="60" step="1" value="25">
    </label>

    <button id="reroll">元雲を再生成</button>
    <button id="resetSpin">元雲の回転をリセット</button>

    <div class="note">
      配置数1は、非対称の雲を1枚だけ切り抜く状態です。<br>
      配置数を増やすと、元雲を 360 / 配置数 ずつ回転して同じ切り取り位置から断片を作ります。<br>
      切り取り幅を下げると、各セクターの断片が細くなります。
    </div>
  </aside>

  <main>
    <canvas id="canvas"></canvas>
    <div class="error" id="error">
      このブラウザでは WebGPU が使えません。<br>
      Chrome / Edge の最新版で開いてください。
    </div>
  </main>

  <script type="module">
    const canvas = document.getElementById('canvas');
    const error = document.getElementById('error');

    const controlIds = [
      'symmetry',
      'cloud',
      'swirl',
      'paper',
      'centerY',
      'cropFill',
      'cropFeather',
      'rotation',
      'rotationSpeed',
      'refreshRate',
    ];

    const controls = Object.fromEntries(
      controlIds.map((id) => [id, document.getElementById(id)])
    );

    const valueEls = Object.fromEntries(
      controlIds.map((id) => [id, document.getElementById(`${id}Value`)])
    );

    const autoRotateEl = document.getElementById('autoRotate');
    const rerollButton = document.getElementById('reroll');
    const resetSpinButton = document.getElementById('resetSpin');

    function readParams() {
      return {
        symmetry: Number(controls.symmetry.value),
        cloud: Number(controls.cloud.value),
        swirl: Number(controls.swirl.value),
        paper: Number(controls.paper.value),
        centerY: Number(controls.centerY.value),
        cropFill: Number(controls.cropFill.value),
        cropFeather: Number(controls.cropFeather.value),
        rotation: Number(controls.rotation.value),
        rotationSpeed: Number(controls.rotationSpeed.value),
        refreshRate: Number(controls.refreshRate.value),
        autoRotate: autoRotateEl.checked,
      };
    }

    function syncLabels() {
      const params = readParams();

      valueEls.symmetry.textContent = String(params.symmetry);
      valueEls.cloud.textContent = params.cloud.toFixed(2);
      valueEls.swirl.textContent = params.swirl.toFixed(2);
      valueEls.paper.textContent = params.paper.toFixed(2);
      valueEls.centerY.textContent = params.centerY.toFixed(2);
      valueEls.cropFill.textContent = params.cropFill.toFixed(2);
      valueEls.cropFeather.textContent = params.cropFeather.toFixed(2);
      valueEls.rotation.textContent = `${Math.round(params.rotation)}°`;
      valueEls.rotationSpeed.textContent = `${Math.round(params.rotationSpeed)}°/s`;
      valueEls.refreshRate.textContent = `${Math.round(params.refreshRate)} FPS`;
    }

    const STORAGE_KEY = 'rotatedCropCloud_settings_v1';

    function saveSettings() {
      const data = {};
      for (const id of controlIds) {
        data[id] = controls[id].value;
      }
      data.autoRotate = autoRotateEl.checked;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (_) {
        // localStorage が無効な環境では無視
      }
    }

    function loadSettings() {
      let data;
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        data = JSON.parse(raw);
      } catch (_) {
        return;
      }
      for (const id of controlIds) {
        if (data[id] != null) controls[id].value = data[id];
      }
      if (data.autoRotate != null) autoRotateEl.checked = data.autoRotate;
    }

    loadSettings();

    let seed = Math.floor(Math.random() * 1_000_000_000);
    let spinOffsetDeg = 0;
    let animationFrameId = null;
    let lastTickMs = 0;
    let lastRenderMs = 0;

    function runSelfTests() {
      console.assert(controls.symmetry.min === '1', '配置数は1から指定できるべきです');
      console.assert(controls.cropFill !== null, 'cropFill スライダーが存在するべきです');
      console.assert(controls.cropFeather !== null, 'cropFeather スライダーが存在するべきです');
      console.assert(typeof readParams().cropFill === 'number', 'cropFill は number であるべきです');
      console.assert(typeof readParams().cropFeather === 'number', 'cropFeather は number であるべきです');
      console.assert(Number.isFinite(seed), 'seed は有限数であるべきです');
      console.info('Self tests passed');
    }

    async function main() {
      if (!navigator.gpu) {
        error.style.display = 'grid';
        return;
      }

      const adapter = await navigator.gpu.requestAdapter();

      if (!adapter) {
        error.textContent = 'WebGPU アダプタを取得できませんでした。';
        error.style.display = 'grid';
        return;
      }

      const device = await adapter.requestDevice();
      const context = canvas.getContext('webgpu');
      const format = navigator.gpu.getPreferredCanvasFormat();

      context.configure({
        device,
        format,
        alphaMode: 'opaque',
      });

      const uniformBuffer = device.createBuffer({
        size: 64,
        usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
      });

      const cloudShader = device.createShaderModule({
        code: /* wgsl */`
struct Uniforms {
  resolution: vec2f,
  symmetry: f32,
  cloud: f32,
  swirl: f32,
  paper: f32,
  centerY: f32,
  cropFill: f32,
  cropFeather: f32,
  rotation: f32,
  seed: f32,
  pad0: f32,
  pad1: f32,
};

@group(0) @binding(0) var<uniform> u: Uniforms;

fn hash(p: vec2f) -> f32 {
  let h = dot(p, vec2f(127.1, 311.7));
  return fract(sin(h) * 43758.5453123);
}

fn noise(p: vec2f) -> f32 {
  let i = floor(p);
  let f = fract(p);

  let a = hash(i);
  let b = hash(i + vec2f(1.0, 0.0));
  let c = hash(i + vec2f(0.0, 1.0));
  let d = hash(i + vec2f(1.0, 1.0));

  let w = f * f * (3.0 - 2.0 * f);
  return mix(mix(a, b, w.x), mix(c, d, w.x), w.y);
}

fn fbm(p0: vec2f) -> f32 {
  var p = p0;
  var amplitude = 0.5;
  var value = 0.0;

  for (var i = 0; i < 6; i = i + 1) {
    value += amplitude * noise(p);
    p = mat2x2f(1.62, 1.11, -1.11, 1.62) * p;
    amplitude *= 0.52;
  }

  return value;
}

fn rotate(p: vec2f, angle: f32) -> vec2f {
  let c = cos(angle);
  let s = sin(angle);
  return mat2x2f(c, -s, s, c) * p;
}

fn unsymmetricCloud(p: vec2f) -> f32 {
  let radius = length(p);
  let angle = atan2(p.y, p.x);
  let seedOffset = vec2f(u.seed * 0.000001, u.seed * 0.0000007);
  let basePoint = p * (2.1 + radius * 2.6);

  let warp = fbm(basePoint * 1.05 + seedOffset) - 0.5;
  let cloudPoint = basePoint + vec2f(u.swirl * warp, -u.swirl * 0.18 * radius);

  var ink = fbm(cloudPoint * 2.2 + seedOffset);
  ink += 0.58 * fbm(cloudPoint * 5.1 - seedOffset);

  let radialRays = pow(abs(sin(angle * 5.5 + radius * 12.0 + warp * 2.0)), 5.0);
  ink += radialRays * 0.24 * smoothstep(0.12, 0.95, radius);

  let radialMask = 1.0 - smoothstep(0.82, 1.08, radius);
  let inkMask = smoothstep(0.40 + u.paper * 0.25, 1.08, ink * u.cloud * radialMask);
  let edgeFade = 1.0 - smoothstep(0.95, 1.18, radius);

  return clamp(inkMask * edgeFade, 0.0, 0.95);
}

@vertex
fn vs(@builtin(vertex_index) vertexIndex: u32) -> @builtin(position) vec4f {
  let positions = array<vec2f, 3>(
    vec2f(-1.0, -3.0),
    vec2f( 3.0,  1.0),
    vec2f(-1.0,  1.0)
  );

  return vec4f(positions[vertexIndex], 0.0, 1.0);
}

@fragment
fn fs(@builtin(position) position: vec4f) -> @location(0) vec4f {
  let tau = 6.28318530718;
  let pi = 3.14159265359;
  let minResolution = min(u.resolution.x, u.resolution.y);

  var uv = (position.xy * 2.0 - u.resolution) / minResolution;
  uv.y = -uv.y;

  let center = vec2f(0.0, u.centerY);
  let localUv = uv - center;
  let radius = length(localUv);
  let rawAngle = atan2(localUv.y, localUv.x);

  let copyCount = max(1.0, floor(u.symmetry + 0.5));
  let sectorAngle = tau / copyCount;
  let wrappedAngle = fract((rawAngle + pi) / tau) * tau;
  let sectorIndex = floor(wrappedAngle / sectorAngle);
  let sectorStart = sectorIndex * sectorAngle - pi;

  // 出力側だけを固定の切り取り窓へ戻す。
  let cropUv = rotate(localUv, -sectorStart);
  let cropAngle = fract(atan2(cropUv.y, cropUv.x) / tau) * tau;
  let centeredCropAngle = cropAngle - sectorAngle * 0.5;
  let halfCrop = sectorAngle * 0.5 * clamp(u.cropFill, 0.0, 1.0);
  let feather = sectorAngle * max(0.0001, u.cropFeather);
  let cropMask = 1.0 - smoothstep(halfCrop, halfCrop + feather, abs(centeredCropAngle));

  // 切り取り窓は固定したまま、元雲だけを配置数ぶんでちょうど360度回転させる。
  let sourceRotation = u.rotation + sectorIndex * sectorAngle;
  let sourceUv = rotate(cropUv, sourceRotation);
  let ink = unsymmetricCloud(sourceUv) * cropMask;

  let paperColor = vec3f(0.0, 0.0, 0.0);
  let inkColor = vec3f(1.0, 1.0, 1.0);
  let color = mix(paperColor, inkColor, ink);

  return vec4f(color, 1.0);
}
`,
      });

      const bindGroupLayout = device.createBindGroupLayout({
        entries: [
          {
            binding: 0,
            visibility: GPUShaderStage.VERTEX | GPUShaderStage.FRAGMENT,
            buffer: { type: 'uniform' },
          },
        ],
      });

      const bindGroup = device.createBindGroup({
        layout: bindGroupLayout,
        entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
      });

      const pipelineLayout = device.createPipelineLayout({
        bindGroupLayouts: [bindGroupLayout],
      });

      const cloudPipeline = device.createRenderPipeline({
        layout: pipelineLayout,
        vertex: { module: cloudShader, entryPoint: 'vs' },
        fragment: { module: cloudShader, entryPoint: 'fs', targets: [{ format }] },
        primitive: { topology: 'triangle-list' },
      });

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
        const height = Math.max(1, Math.floor(canvas.clientHeight * dpr));

        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
      }

      function getCurrentRotationDeg() {
        const params = readParams();
        return params.rotation + spinOffsetDeg;
      }

      function updateUniforms() {
        const params = readParams();
        const rotationRad = getCurrentRotationDeg() * Math.PI / 180;

        const data = new Float32Array([
          canvas.width,
          canvas.height,
          params.symmetry,
          params.cloud,
          params.swirl,
          params.paper,
          params.centerY,
          params.cropFill,
          params.cropFeather,
          rotationRad,
          seed,
          0,
          0,
        ]);

        device.queue.writeBuffer(uniformBuffer, 0, data);
      }

      function render() {
        resize();
        updateUniforms();

        const view = context.getCurrentTexture().createView();
        const encoder = device.createCommandEncoder();

        const pass = encoder.beginRenderPass({
          colorAttachments: [
            {
              view,
              clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 1.0 },
              loadOp: 'clear',
              storeOp: 'store',
            },
          ],
        });

        pass.setBindGroup(0, bindGroup);
        pass.setPipeline(cloudPipeline);
        pass.draw(3);
        pass.end();

        device.queue.submit([encoder.finish()]);
      }

      function animationLoop(nowMs) {
        if (lastTickMs === 0) lastTickMs = nowMs;
        if (lastRenderMs === 0) lastRenderMs = nowMs;

        const params = readParams();
        const deltaMs = nowMs - lastTickMs;
        lastTickMs = nowMs;

        if (params.autoRotate) {
          spinOffsetDeg += params.rotationSpeed * (deltaMs / 1000);

          const frameIntervalMs = 1000 / Math.max(1, params.refreshRate);

          if (nowMs - lastRenderMs >= frameIntervalMs) {
            render();
            lastRenderMs = nowMs;
          }
        } else {
          lastRenderMs = nowMs;
        }

        animationFrameId = requestAnimationFrame(animationLoop);
      }

      for (const input of Object.values(controls)) {
        input.addEventListener('input', () => {
          syncLabels();
          saveSettings();
          render();
        });
      }

      autoRotateEl.addEventListener('change', () => {
        syncLabels();
        saveSettings();
        render();
      });

      rerollButton.addEventListener('click', () => {
        seed = Math.floor(Math.random() * 1_000_000_000);
        render();
      });

      resetSpinButton.addEventListener('click', () => {
        spinOffsetDeg = 0;
        render();
      });

      window.addEventListener('resize', render);

      runSelfTests();
      resize();
      syncLabels();
      render();

      animationFrameId = requestAnimationFrame(animationLoop);

      window.addEventListener('beforeunload', () => {
        if (animationFrameId !== null) cancelAnimationFrame(animationFrameId);
      });
    }

    main().catch((err) => {
      console.error(err);
      error.textContent = `WebGPU初期化でエラーが発生しました: ${err.message}`;
      error.style.display = 'grid';
    });
  </script>
</body>
</html>
